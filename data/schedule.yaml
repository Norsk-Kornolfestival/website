friday:
  date: "2026-10-08"
  title:
    nb: Fredag 8. oktober
    en: Friday, October 8
  events:
    - time: "10:00–16:00"
      title:
        nb: Tradisjonell gardsbrygging i eldhus. Eigen billett (Bryggepass).
        en: Traditional farmhouse brewing workshop in an eldhus.
      description:
        nb: >-
          Oppmøte Raftevold Hotell. Leia av Stig Seljeset (kveik #22 Stalljen).
          Einerlåg, mesking,
          renning, kjøling, tilsetjing av kveik (med skriking).
          Ingen koking (rå-øl). Inkluderer spekemat, flatbrød-lunsj og kornøl.
        en: >-
          Show up at the hotel for transport to brewhouse. Led by Stig Seljeset
          (kveik #22 Stalljen). Juniper infusion, mashing,
          lautering, cooling, kveik pitching (with screaming).
          No boiling (raw ale). Includes traditional cured meats,
          flatbread lunch, and kornøl.
      note:
        nb: Eigen billett (Bryggepass).
        en: Separate ticket (Brewing Pass).
    - time: "11:00–15:00"
      title:
        nb: Bryggeøkt berre for kvinner.
        en: Women-only brewing session.
      description:
        nb: >-
          Oppmøte Raftevold Hotell. Leia av Olav Sverre Gausemel (kveik #18
          Gausemel). Samme innhold som den andre brygginga, men kun for
          kvinner. Lunsj og kornøl inkludert.
        en: >-
          Show up at Raftevold Hotell for transport. Led by Olav Sverre
          Gausemel (kveik #18 Gausemel). Same content
          as the other brew session, but for women only. Lunch and kornøl
          included.
      note:
        nb: Eigen billett.
        en: Separate ticket.
    - time: "17:00"
      title:
        nb: Dørene opnar
        en: Doors open
    - time: "18:00"
      title:
        nb: Offisiell festivalopning
        en: Official festival opening
    - time: "20:00"
      title:
        nb: Heimebryggjarane pakkar saman; kommersielle bryggeri byrjar sal
        en: Home brewers pack up; commercial breweries begin sales
    - time: "00:30"
      title:
        nb: Festivalen stenger
        en: Festival closes

saturday:
  date: "2026-10-09"
  title:
    nb: Laurdag 9. oktober
    en: Saturday, October 9
  events:
    - time: "12:00"
      title:
        nb: Festivalen opnar
        en: Festival opens
    - time: "18:00"
      title:
        nb: Heimebryggjarane pakkar saman; kommersielle bryggeri byrjar sal
        en: Home brewers pack up; commercial breweries begin sales
    - time: "18:45"
      title:
        nb: Festivalmiddag på Raftevold Hotell. Eigen billett.
        en: Festival dinner at Raftevold Hotel. Separate ticket.
      description:
        nb: >-
          Tradisjonell mat: saudehaud (smalahove), kokte poteter,
          kålrotstappe, Nordfjord-pannekaker. Tre typar tradisjonelt
          øl: Hornindal konnjøl, Voss heimabrygg, Stjørdalsøl.
        en: >-
          Traditional fare: saudehaud (sheep's head), boiled potatoes, rutabaga mash,
          Nordfjord pancakes. Three styles of traditional ale: Hornindal konnjøl,
          Voss homebrew, Stjørdalsøl.
    - time: "01:00"
      title:
        nb: Festivalen stenger
        en: Festival closes

